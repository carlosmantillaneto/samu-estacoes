<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Estações - SAMU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        samured: '#E30613',
                        samudark: '#0A2540',
                        samublue: '#F0F6FB'
                    } 
                } 
            } 
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    
    <!-- Header Oficial SAMU Limpo (Sem selo Mogi) -->
    <header class="bg-white text-samudark shadow-sm sticky top-0 z-40 border-b-4 border-samured">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded overflow-hidden shadow border border-gray-200 bg-white flex items-center justify-center">
                    <img src="logo-samu.jpg" alt="Logo SAMU" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-base font-bold leading-tight tracking-wide text-samudark">SAMU <span class="text-samured">192</span></h1>
                    <p class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider">Controle de Estações TI</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 mb-20">
        <div id="loading" class="text-center py-10">
            <i class="fas fa-spinner fa-spin text-4xl text-samured"></i>
            <p class="mt-2 text-gray-600 text-sm">Sincronizando com a base...</p>
        </div>
        <div id="lista-estacoes" class="space-y-4 hidden"></div>
    </main>

    <!-- Botão Flutuante (Criar Novo) -->
    <button onclick="abrirModal('criar')" class="fixed bottom-6 right-6 bg-samured text-white w-14 h-14 rounded-full shadow-lg hover:bg-red-700 transition flex items-center justify-center text-2xl z-40 border-2 border-white">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Modal de Formulário / Visualização -->
    <div id="modal-cadastro" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-lg w-full max-w-md shadow-xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="bg-samudark px-4 py-3 flex justify-between items-center text-white border-b-4 border-samured shrink-0">
                <h2 id="titulo-modal" class="font-bold text-sm">Estação de Trabalho</h2>
                <!-- Botões de Ação e Fechar -->
                <div class="flex items-center gap-2">
                    <button onclick="mudarParaEdicao()" id="btn-edit-modal" class="text-white hover:text-red-300 p-1 rounded transition hidden" title="Editar"><i class="fas fa-edit"></i></button>
                    <button onclick="deletarEquipamentoModal()" id="btn-del-modal" class="text-white hover:text-red-300 p-1 rounded transition hidden" title="Excluir"><i class="fas fa-trash"></i></button>
                    <button onclick="fecharModal()" class="text-white hover:text-gray-200 ml-2"><i class="fas fa-times text-xl"></i></button>
                </div>
            </div>
            
            <div class="overflow-y-auto p-4 space-y-4">
                <form id="form-equipamento" class="space-y-3" onsubmit="salvarEquipamento(event)">
                    <input type="hidden" id="item-id">
                    <input type="hidden" id="item-acao" value="criar">
                    
                    <!-- Responsável e Setor -->
                    <div class="grid grid-cols-2 gap-3 bg-samublue p-3 rounded border border-blue-100">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Responsável</label>
                            <input type="text" id="responsavel" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-gray-500" required placeholder="Marcelo">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Setor / Base</label>
                            <input type="text" id="setor" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-gray-500" required placeholder="Administração">
                        </div>
                    </div>

                    <!-- Computador & Hostname -->
                    <div class="p-3 bg-samublue border border-blue-100 rounded-md space-y-2">
                        <p class="text-xs font-bold text-gray-800 uppercase tracking-wide">Computador</p>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-700">Hostname</label>
                            <input type="text" id="hostname" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="Samu-Mogi-01">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Fabricante</label>
                                <input type="text" id="fabricante" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Modelo</label>
                                <input type="text" id="modelo" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Serial Number</label>
                                <input type="text" id="serial" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Patrimônio</label>
                                <input type="text" id="patrimonio" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-gray-700">CPU</label>
                                <input type="text" id="cpu" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="I5">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-gray-700">Memória</label>
                                <input type="text" id="memoria" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="8gb">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-gray-700">Armazenamento</label>
                                <input type="text" id="armazenamento" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="Ssd 240">
                            </div>
                        </div>
                    </div>

                    <!-- Monitor -->
                    <div class="p-3 bg-samublue border border-blue-100 rounded-md space-y-2">
                        <p class="text-xs font-bold text-gray-800 uppercase tracking-wide">Monitor</p>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Identificação</label>
                                <input type="text" id="monitor1" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="Monitor 1">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Modelo</label>
                                <input type="text" id="mod1" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-gray-700">Serial</label>
                                <input type="text" id="ser1" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-gray-700">Patrimônio</label>
                                <input type="text" id="pat1" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                        </div>
                    </div>

                    <!-- Monitor Secundário -->
                    <div class="p-3 bg-samublue border border-blue-100 rounded-md space-y-2">
                        <p class="text-xs font-bold text-gray-800 uppercase tracking-wide">Monitor Secundário</p>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Identificação</label>
                                <input type="text" id="monitor2" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Fabricante</label>
                                <input type="text" id="fab2" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-gray-700">Modelo</label>
                                <input type="text" id="mod2" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-gray-700">Serial</label>
                                <input type="text" id="ser2" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-gray-700">Patrimônio</label>
                                <input type="text" id="pat2" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                        </div>
                    </div>

                    <!-- Nobreak -->
                    <div class="p-3 bg-samublue border border-blue-100 rounded-md space-y-2">
                        <p class="text-xs font-bold text-gray-800 uppercase tracking-wide">Nobreak</p>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Nobreak</label>
                                <input type="text" id="nobreak" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="Nobreak">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Fabricante</label>
                                <input type="text" id="fabN" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Serial</label>
                                <input type="text" id="serN" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-700">Patrimônio</label>
                                <input type="text" id="patN" class="w-full border border-gray-300 rounded p-1.5 text-xs focus:outline-none focus:border-gray-500" placeholder="-">
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" id="btn-salvar" class="w-full bg-samured hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition flex justify-center items-center mt-3 shadow">
                        Salvar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxoAeIrAI-gtmFWD9b6dT0fzfp7kVas-mfUxKtN9ChDbLkftGLEMtVQPs6bJ7xq6p2o/exec";
        let dadosGlobais = [];

        function capitalizar(str) {
            if (!str || str === '-') return '-';
            return str.toLowerCase().replace(/(^|\s)\S/g, function(L) { return L.toUpperCase(); });
        }

        async function carregarDados() {
            const loading = document.getElementById('loading');
            const lista = document.getElementById('lista-estacoes');
            
            loading.classList.remove('hidden');
            lista.classList.add('hidden');
            lista.innerHTML = ''; 

            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.status === "success") {
                    dadosGlobais = result.data;
                    
                    dadosGlobais.forEach(function(eq) {
                        var resp = capitalizar(eq['Responsavel'] || eq['Responsável'] || 'Sem Atribuição');
                        var setor = capitalizar(eq['Setor'] || '-');
                        var idItem = eq['ID'] || '';
                        
                        var cardHTML = '<div class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden mb-3">' +
                            '<div class="bg-gray-50 p-3.5 flex justify-between items-center border-l-4 border-samured cursor-pointer hover:bg-gray-100 transition" onclick="abrirModal(\'visualizar\', \'' + idItem + '\')">' +
                                '<div class="flex items-center gap-3 truncate">' +
                                    '<div class="bg-red-50 w-9 h-9 flex justify-center items-center rounded-full text-samured flex-shrink-0 border border-red-100">' +
                                        '<i class="fas fa-user text-sm"></i>' +
                                    '</div>' +
                                    '<div class="truncate">' +
                                        '<h3 class="font-bold text-black uppercase text-sm truncate">' + resp + '</h3>' +
                                        '<p class="text-[11px] text-gray-400 truncate"><i class="fas fa-map-marker-alt text-samured"></i> ' + setor + '</p>' +
                                    '</div>' +
                                '</div>' +
                                '<div class="text-gray-400 text-sm"><i class="fas fa-chevron-right"></i></div>' +
                            '</div>' +
                        '</div>';
                        lista.innerHTML += cardHTML;
                    });

                    loading.classList.add('hidden');
                    lista.classList.remove('hidden');
                }
            } catch (error) {
                loading.innerHTML = '<p class="text-red-500"><i class="fas fa-exclamation-triangle"></i> Falha ao carregar os dados.</p>';
            }
        }

        var currentEditingId = null;

        function abrirModal(acao, id) {
            document.getElementById('modal-cadastro').classList.remove('hidden');
            var btnSalvar = document.getElementById('btn-salvar');
            var btnEditModal = document.getElementById('btn-edit-modal');
            var btnDelModal = document.getElementById('btn-del-modal');
            var inputs = document.getElementById('form-equipamento').querySelectorAll('input, select');
            
            currentEditingId = id;
            
            if (acao === 'criar') {
                document.getElementById('titulo-modal').innerText = 'Nova Estação de Trabalho';
                document.getElementById('form-equipamento').reset();
                document.getElementById('item-acao').value = 'criar';
                document.getElementById('item-id').value = '';
                btnSalvar.style.display = 'block';
                btnEditModal.classList.add('hidden');
                btnDelModal.classList.add('hidden');
                inputs.forEach(i => i.disabled = false);
                
                document.getElementById('monitor2').closest('.p-3').style.display = 'block';
                document.getElementById('nobreak').closest('.p-3').style.display = 'block';
            } else {
                var item = dadosGlobais.find(function(i) { return i['ID'].toString().trim() === id.toString().trim(); });
                
                if(item) {
                    document.getElementById('item-id').value = item['ID'] || '';
                    document.getElementById('responsavel').value = item['Responsavel'] || item['Responsável'] || '';
                    document.getElementById('setor').value = item['Setor'] || '';
                    document.getElementById('hostname').value = item['Hostname'] || '';
                    document.getElementById('fabricante').value = item['Fabricante'] || '';
                    document.getElementById('modelo').value = item['Modelo'] || '';
                    document.getElementById('serial').value = item['Serial Number'] || '';
                    document.getElementById('patrimonio').value = item['Patrimonio'] || '';
                    document.getElementById('cpu').value = item['CPU'] || '';
                    document.getElementById('memoria').value = item['Memoria'] || '';
                    document.getElementById('armazenamento').value = item['Armazenamento'] || '';
                    
                    document.getElementById('monitor1').value = item['Monitor 1'] || '';
                    document.getElementById('mod1').value = item['Modelo 1'] || '';
                    document.getElementById('ser1').value = item['Serial 1'] || '';
                    document.getElementById('pat1').value = item['Patrimonio 1'] || '';

                    document.getElementById('monitor2').value = item['Monitor 2'] || '';
                    document.getElementById('fab2').value = item['Fabricante 2'] || '';
                    document.getElementById('mod2').value = item['Modelo 2'] || '';
                    document.getElementById('ser2').value = item['Serial 2'] || '';
                    document.getElementById('pat2').value = item['Patrimonio 2'] || '';

                    document.getElementById('nobreak').value = item['Nobreak'] || '';
                    document.getElementById('fabN').value = item['Fabricante N'] || '';
                    document.getElementById('serN').value = item['Serial N'] || '';
                    document.getElementById('patN').value = item['Patrimonio N'] || '';

                    ocultarVazios('monitor2', item['Monitor 2']);
                    ocultarVazios('nobreak', item['Nobreak']);

                    if (acao === 'visualizar') {
                        document.getElementById('titulo-modal').innerText = 'Visualização';
                        btnSalvar.style.display = 'none';
                        btnEditModal.classList.remove('hidden');
                        btnDelModal.classList.remove('hidden');
                        inputs.forEach(i => i.disabled = true);
                    } else {
                        document.getElementById('titulo-modal').innerText = 'Editar Estação';
                        document.getElementById('item-acao').value = 'editar';
                        btnSalvar.style.display = 'block';
                        btnEditModal.classList.add('hidden');
                        btnDelModal.classList.add('hidden');
                        inputs.forEach(i => i.disabled = false);
                    }
                } else {
                    alert("Erro: Item não encontrado.");
                    fecharModal();
                }
            }
        }

        function mudarParaEdicao() {
            var btnSalvar = document.getElementById('btn-salvar');
            var btnEditModal = document.getElementById('btn-edit-modal');
            var btnDelModal = document.getElementById('btn-del-modal');
            var inputs = document.getElementById('form-equipamento').querySelectorAll('input, select');
            
            document.getElementById('titulo-modal').innerText = 'Editar Estação';
            document.getElementById('item-acao').value = 'editar';
            btnSalvar.style.display = 'block';
            btnEditModal.classList.add('hidden');
            btnDelModal.classList.add('hidden');
            inputs.forEach(i => i.disabled = false);
            
            document.getElementById('monitor2').closest('.p-3').style.display = 'block';
            document.getElementById('nobreak').closest('.p-3').style.display = 'block';
        }

        function ocultarVazios(elId, valor) {
            var el = document.getElementById(elId).closest('.p-3');
            if (el) {
                if (!valor || valor.trim() === '' || valor.trim() === '-') {
                    el.style.display = 'none';
                } else {
                    el.style.display = 'block';
                }
            }
        }

        function fecharModal() {
            document.getElementById('modal-cadastro').classList.add('hidden');
        }

        async function deletarEquipamentoModal() {
            if(!currentEditingId) return;
            if(!confirm("Tem certeza que deseja apagar esta estação permanentemente?")) {
                return;
            }
            
            var dados = { acao: 'deletar', id: currentEditingId };

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(dados) });
                fecharModal();
                carregarDados();
            } catch (error) {
                alert("Erro ao apagar o registro.");
            }
        }

        async function salvarEquipamento(event) {
            event.preventDefault();
            var btn = document.getElementById('btn-salvar');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Processando...';
            btn.disabled = true;

            var dados = {
                acao: document.getElementById('item-acao').value,
                id: document.getElementById('item-id').value,
                responsavel: capitalizar(document.getElementById('responsavel').value.trim()) || '-',
                setor: capitalizar(document.getElementById('setor').value.trim()) || '-',
                hostname: document.getElementById('hostname').value.trim().toUpperCase() || '-',
                fabricante: capitalizar(document.getElementById('fabricante').value.trim()) || '-',
                modelo: capitalizar(document.getElementById('modelo').value.trim()) || '-',
                serial: document.getElementById('serial').value.trim() || '-',
                patrimonio: document.getElementById('patrimonio').value.trim() || '-',
                cpu: document.getElementById('cpu').value.trim() || '-',
                memoria: document.getElementById('memoria').value.trim() || '-',
                armazenamento: document.getElementById('armazenamento').value.trim() || '-',
                monitor1: capitalizar(document.getElementById('monitor1').value.trim()) || '-',
                mod1: capitalizar(document.getElementById('mod1').value.trim()) || '-',
                ser1: document.getElementById('ser1').value.trim() || '-',
                pat1: document.getElementById('pat1').value.trim() || '-',
                monitor2: capitalizar(document.getElementById('monitor2').value.trim()) || '-',
                fab2: capitalizar(document.getElementById('fab2').value.trim()) || '-',
                mod2: capitalizar(document.getElementById('mod2').value.trim()) || '-',
                ser2: document.getElementById('ser2').value.trim() || '-',
                pat2: document.getElementById('pat2').value.trim() || '-',
                nobreak: capitalizar(document.getElementById('nobreak').value.trim()) || '-',
                fabN: capitalizar(document.getElementById('fabN').value.trim()) || '-',
                serN: document.getElementById('serN').value.trim() || '-',
                patN: document.getElementById('patN').value.trim() || '-'
            };

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(dados) });
                fecharModal();
                carregarDados();
            } catch (error) {
                alert("Erro ao comunicar com a base.");
            } finally {
                btn.innerHTML = 'Salvar';
                btn.disabled = false;
            }
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
