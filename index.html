<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Estações - SAMU Mogi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        samured: '#E30613',
                        samudark: '#1A1A1A'
                    } 
                } 
            } 
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    
    <!-- Header Oficial SAMU Mogi -->
    <header class="bg-white text-samudark shadow-sm sticky top-0 z-40 border-b-4 border-samured">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-samured text-white p-2 rounded-md flex items-center justify-center w-10 h-10 shadow">
                    <i class="fas fa-star-of-life text-xl font-bold"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold leading-tight tracking-wide text-samudark">SAMU <span class="text-samured">192</span></h1>
                    <p class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider">Controle de Estações TI</p>
                </div>
            </div>
            <div class="bg-red-50 border border-red-200 px-2 py-1 rounded text-[10px] font-bold text-samured uppercase">
                MOGI
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 mb-20">
        <div id="loading" class="text-center py-10">
            <i class="fas fa-spinner fa-spin text-4xl text-samured"></i>
            <p class="mt-2 text-gray-600 text-sm">Sincronizando com a base...</p>
        </div>
        <div id="lista-estacoes" class="space-y-4 hidden"></div>
    </main>

    <!-- Botão Flutuante (Criar Novo) -->
    <button onclick="abrirModal('criar')" class="fixed bottom-6 right-6 bg-samured text-white w-14 h-14 rounded-full shadow-lg hover:bg-red-700 transition flex items-center justify-center text-2xl z-40 border-2 border-white">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Modal de Formulário -->
    <div id="modal-cadastro" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-lg w-full max-w-md shadow-xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="bg-samudark px-4 py-3 flex justify-between items-center text-white border-b-4 border-samured shrink-0">
                <h2 id="titulo-modal" class="font-bold text-sm">Novo Equipamento</h2>
                <button onclick="fecharModal()" class="text-white hover:text-gray-200"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="overflow-y-auto p-4">
                <form id="form-equipamento" class="space-y-3" onsubmit="salvarEquipamento(event)">
                    <input type="hidden" id="item-id">
                    <input type="hidden" id="item-acao" value="criar">
                    
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Responsável / Usuário</label>
                        <input type="text" id="responsavel" class="w-full border rounded p-2 text-sm uppercase focus:ring-2 focus:ring-samured" required placeholder="Ex: RECEPÇÃO">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Tipo de Item</label>
                        <select id="tipo" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-samured" onchange="tratarMudancaTipo()" required>
                            <option value="Computador">Computador</option>
                            <option value="Monitor">Monitor</option>
                            <option value="Nobreak">Nobreak</option>
                            <option value="Impressora">Impressora</option>
                        </select>
                    </div>
                    
                    <div id="bloco-geral-campos" class="space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Hostname</label>
                                <input type="text" id="hostname" class="w-full border rounded p-2 text-sm uppercase focus:ring-2 focus:ring-samured" placeholder="-">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Patrimônio</label>
                                <input type="text" id="patrimonio" class="w-full border rounded p-2 text-sm uppercase focus:ring-2 focus:ring-samured" placeholder="-">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Marca / Fabricante</label>
                            <input type="text" id="marca" class="w-full border rounded p-2 text-sm uppercase focus:ring-2 focus:ring-samured" placeholder="-">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Modelo</label>
                            <input type="text" id="modelo" class="w-full border rounded p-2 text-sm uppercase focus:ring-2 focus:ring-samured" placeholder="-">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Serial Number</label>
                        <input type="text" id="serial" class="w-full border rounded p-2 text-sm uppercase focus:ring-2 focus:ring-samured" placeholder="-">
                    </div>

                    <!-- Bloco de Hardware -->
                    <div id="bloco-hardware" class="space-y-3 p-3 bg-gray-50 border rounded-md">
                        <p class="text-xs font-bold text-samudark uppercase"><i class="fas fa-microchip mr-1 text-samured"></i> Especificações Técnicas</p>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Processador</label>
                            <input type="text" id="processador" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-samured" placeholder="-">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Memória RAM</label>
                                <input type="text" id="memoria" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-samured" placeholder="-">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Armazenamento</label>
                                <input type="text" id="armazenamento" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-samured" placeholder="-">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Setor / Base</label>
                        <input type="text" id="setor" class="w-full border rounded p-2 text-sm uppercase focus:ring-2 focus:ring-samured" placeholder="-">
                    </div>
                    
                    <button type="submit" id="btn-salvar" class="w-full bg-samured hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition flex justify-center items-center mt-3 shadow">
                        Salvar Registro
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxoAeIrAI-gtmFWD9b6dT0fzfp7kVas-mfUxKtN9ChDbLkftGLEMtVQPs6bJ7xq6p2o/exec";
        let dadosGlobais = [];

        async function carregarDados() {
            const loading = document.getElementById('loading');
            const lista = document.getElementById('lista-estacoes');
            
            loading.classList.remove('hidden');
            lista.classList.add('hidden');
            lista.innerHTML = ''; 

            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.status === "success") {
                    dadosGlobais = result.data;
                    const estacoes = {};
                    
                    dadosGlobais.forEach(item => {
                        const respRaw = item['Responsavel'] || item['Responsável'] || 'SEM ATRIBUIÇÃO';
                        const resp = respRaw.toUpperCase(); 
                        if (!estacoes[resp]) estacoes[resp] = { nomeDisplay: respRaw, setor: item['Setor'] || '-', itens: [] };
                        estacoes[resp].itens.push(item);
                    });

                    let indexCounter = 0;
                    Object.keys(estacoes).sort().forEach(chaveResp => {
                        const grupo = estacoes[chaveResp];
                        const equipamentos = grupo.itens;
                        const setorInfo = grupo.setor;
                        const currentIdx = indexCounter++;
                        
                        let htmlEquips = '';
                        equipamentos.forEach(eq => {
                            let icone = 'fa-desktop';
                            let tipoStr = (eq['Tipo'] || '').toLowerCase();
                            if(tipoStr.includes('monitor')) icone = 'fa-tv';
                            if(tipoStr.includes('nobreak')) icone = 'fa-car-battery';
                            if(tipoStr.includes('impressora')) icone = 'fa-print';

                            let specHtml = '';
                            if(eq['Processador'] && eq['Processador'] !== '-') {
                                specHtml = '<div class="bg-gray-50 p-1.5 rounded border col-span-2"><span class="font-semibold block text-[10px] text-gray-400">ESPECIFICAÇÕES</span>' + eq['Processador'] + ' | ' + (eq['Memoria'] || '-') + ' | ' + (eq['Armazenamento'] || '-') + '</div>';
                            }

                            let infoCampos = '';
                            if(!tipoStr.includes('monitor')) {
                                infoCampos = '<div class="bg-gray-50 p-1.5 rounded border"><span class="font-semibold block text-[10px] text-gray-400">HOSTNAME</span>' + (eq['Hostname'] || '-') + '</div>' +
                                             '<div class="bg-gray-50 p-1.5 rounded border"><span class="font-semibold block text-[10px] text-gray-400">PATRIMÔNIO</span>' + (eq['Patrimonio'] || '-') + '</div>';
                            }

                            htmlEquips += '<div class="bg-white p-3 border rounded-lg shadow-sm mb-3">' +
                                '<div class="flex justify-between items-center mb-2 pb-2 border-b">' +
                                    '<div class="flex items-center gap-2">' +
                                        '<i class="fas ' + icone + ' text-samured"></i>' +
                                        '<span class="font-bold text-sm text-gray-800 uppercase">' + eq['Tipo'] + '</span>' +
                                    '</div>' +
                                    '<div class="flex items-center gap-1">' +
                                        '<button onclick="abrirModal(\'editar\', \'' + eq['ID'] + '\')" class="text-samured hover:bg-red-50 p-1.5 rounded transition" title="Editar"><i class="fas fa-edit"></i></button>' +
                                        '<button onclick="deletarEquipamento(event, \'' + eq['ID'] + '\')" class="text-gray-400 hover:text-red-600 hover:bg-red-50 p-1.5 rounded transition" title="Excluir"><i class="fas fa-trash"></i></button>' +
                                    '</div>' +
                                '</div>' +
                                '<div class="grid grid-cols-2 gap-2 text-xs text-gray-600">' +
                                    infoCampos +
                                    '<div class="bg-gray-50 p-1.5 rounded border"><span class="font-semibold block text-[10px] text-gray-400">MARCA / MODELO</span>' + (eq['Marca'] || '-') + ' ' + (eq['Modelo'] || '') + '</div>' +
                                    '<div class="bg-gray-50 p-1.5 rounded border"><span class="font-semibold block text-[10px] text-gray-400">SERIAL NUMBER</span>' + (eq['Serial Number'] || '-') + '</div>' +
                                    specHtml +
                                '</div>' +
                            '</div>';
                        });

                        const cardHTML = '<div class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden mb-3">' +
                            '<div class="bg-gray-50 p-3 flex justify-between items-center cursor-pointer hover:bg-gray-100 transition border-l-4 border-samured" onclick="toggleAccordion(\'acc-' + currentIdx + '\')">' +
                                '<div class="flex items-center gap-3">' +
                                    '<div class="bg-red-50 w-9 h-9 flex justify-center items-center rounded-full text-samured flex-shrink-0 border border-red-100">' +
                                        '<i class="fas fa-user text-sm"></i>' +
                                    '</div>' +
                                    '<div class="truncate">' +
                                        '<h3 class="font-bold text-gray-800 uppercase text-sm truncate">' + grupo.nomeDisplay + '</h3>' +
                                        '<p class="text-[11px] text-gray-500 truncate"><i class="fas fa-map-marker-alt text-samured"></i> ' + setorInfo + '</p>' +
                                    '</div>' +
                                '</div>' +
                                '<div class="flex items-center gap-2 flex-shrink-0">' +
                                    '<i class="fas fa-chevron-down text-gray-400 transition-transform duration-200 text-sm" id="icon-' + currentIdx + '"></i>' +
                                '</div>' +
                            '</div>' +
                            '<div id="acc-' + currentIdx + '" class="hidden p-3 bg-gray-100 border-t">' +
                                htmlEquips +
                            '</div>' +
                        '</div>';
                        lista.innerHTML += cardHTML;
                    });

                    loading.classList.add('hidden');
                    lista.classList.remove('hidden');
                }
            } catch (error) {
                loading.innerHTML = '<p class="text-red-500"><i class="fas fa-exclamation-triangle"></i> Falha ao carregar os dados.</p>';
            }
        }

        function toggleAccordion(id) {
            const element = document.getElementById(id);
            const icon = document.getElementById(id.replace('acc-', 'icon-'));
            if (element.classList.contains('hidden')) {
                element.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                element.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function tratarMudancaTipo() {
            const tipo = document.getElementById('tipo').value;
            const blocoHardware = document.getElementById('bloco-hardware');
            const blocoGeralCampos = document.getElementById('bloco-geral-campos');
            
            if (tipo === 'Monitor') {
                blocoHardware.style.display = 'none';
                blocoGeralCampos.style.display = 'none';
            } else if (tipo === 'Nobreak' || tipo === 'Impressora') {
                blocoHardware.style.display = 'none';
                blocoGeralCampos.style.display = 'block';
            } else {
                blocoHardware.style.display = 'block';
                blocoGeralCampos.style.display = 'block';
            }
        }

        function abrirModal(acao, id = null) {
            document.getElementById('modal-cadastro').classList.remove('hidden');
            document.getElementById('item-acao').value = acao;
            
            if (acao === 'criar') {
                document.getElementById('titulo-modal').innerText = 'Novo Equipamento';
                document.getElementById('form-equipamento').reset();
                document.getElementById('item-id').value = '';
                tratarMudancaTipo();
            } else if (acao === 'editar') {
                document.getElementById('titulo-modal').innerText = 'Editar Equipamento';
                const item = dadosGlobais.find(i => i['ID'].toString().trim() === id.toString().trim());
                
                if(item) {
                    document.getElementById('item-id').value = item['ID'] || '';
                    document.getElementById('responsavel').value = item['Responsavel'] || item['Responsável'] || '';
                    document.getElementById('tipo').value = item['Tipo'] || 'Computador';
                    document.getElementById('hostname').value = item['Hostname'] || '';
                    document.getElementById('patrimonio').value = item['Patrimonio'] || '';
                    document.getElementById('marca').value = item['Marca'] || '';
                    document.getElementById('modelo').value = item['Modelo'] || '';
                    document.getElementById('serial').value = item['Serial Number'] || '';
                    document.getElementById('processador').value = item['Processador'] || '';
                    document.getElementById('memoria').value = item['Memoria'] || '';
                    document.getElementById('armazenamento').value = item['Armazenamento'] || '';
                    document.getElementById('setor').value = item['Setor'] || '';
                    tratarMudancaTipo();
                } else {
                    alert("Erro: Item não encontrado.");
                    fecharModal();
                }
            }
        }

        function fecharModal() {
            document.getElementById('modal-cadastro').classList.add('hidden');
        }

        async function deletarEquipamento(event, id) {
            event.stopPropagation();
            if(!confirm("Tem certeza que deseja apagar este equipamento permanentemente?")) {
                return;
            }
            
            const btn = event.currentTarget;
            const iconeOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const dados = { acao: 'deletar', id: id };

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(dados) });
                carregarDados();
            } catch (error) {
                alert("Erro ao apagar o registro.");
                btn.innerHTML = iconeOriginal;
                btn.disabled = false;
            }
        }

        async function salvarEquipamento(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-salvar');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Processando...';
            btn.disabled = true;

            const dados = {
                acao: document.getElementById('item-acao').value,
                id: document.getElementById('item-id').value,
                responsavel: document.getElementById('responsavel').value.trim() || '-',
                tipo: document.getElementById('tipo').value,
                hostname: document.getElementById('hostname').value.trim() || '-',
                patrimonio: document.getElementById('patrimonio').value.trim() || '-',
                marca: document.getElementById('marca').value.trim() || '-',
                modelo: document.getElementById('modelo').value.trim() || '-',
                serial: document.getElementById('serial').value.trim() || '-',
                processador: document.getElementById('processador').value.trim() || '-',
                memoria: document.getElementById('memoria').value.trim() || '-',
                armazenamento: document.getElementById('armazenamento').value.trim() || '-',
                setor: document.getElementById('setor').value.trim() || '-'
            };

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(dados) });
                fecharModal();
                carregarDados();
            } catch (error) {
                alert("Erro ao comunicar com a base.");
            } finally {
                btn.innerHTML = 'Salvar Registro';
                btn.disabled = false;
            }
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
